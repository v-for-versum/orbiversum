[package]
name = "firmware-jc3636k718c"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace root: this crate builds only for xtensa-esp32s3-espidf and must
# never be part of the host `cargo test --workspace`.
[workspace]

[dependencies]
esp-idf-svc = "0.53"
log = "0.4"
board-jc3636k718c = { path = "../crates/board-jc3636k718c" }
orbiversum-os = { path = "../sdk/os" }
orbiversum-core = { path = "../sdk/core" }
applets = { path = "../crates/applets" }
dsp = { path = "../crates/dsp" }

[build-dependencies]
embuild = "0.33"

# The C BSP (and its Component Manager dependencies: LVGL, esp_lvgl_port, ...)
# is compiled by ESP-IDF's CMake as an extra component.
[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["../../components/bsp_jc3636k718c"]

# Mirrors the host workspace lints in ../Cargo.toml (this crate is its own workspace root).
[lints.clippy]
all = { level = "warn", priority = -1 }
