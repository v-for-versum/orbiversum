[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v6.1"
# Generated baseline for this board (IDF 6.1.0), then the crate's own overrides.
ESP_IDF_SDKCONFIG_DEFAULTS = "../../sdkconfig.jc3636k718c;sdkconfig.defaults"
ESP_IDF_TOOLS_INSTALL_DIR = "global"

