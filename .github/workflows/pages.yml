# Builds the firmware on a version tag, merges it into one flashable image, publishes the
# site (landing + browser flasher) on GitHub Pages and attaches the image to a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# A push to main (paths below) builds, warms the cache and deploys Pages; only tags make a Release.
# Needs: Settings -> Pages -> Source = "GitHub Actions". The build needs the board baseline
# `sdkconfig.jc3636k718c` to be tracked in git.
name: site

on:
  push:
    tags: ["v*"]
    # A build on main also warms the cache: caches made on a tag are not visible to other
    # tags, but every ref can read the default branch's cache.
    branches: [main]
    paths:
      - "rust/**"
      - "components/**"
      - "sdkconfig*"
      - "dependencies.lock"
      - "tools/webflash/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: System packages for ESP-IDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build python3-venv libusb-1.0-0 git

      - name: Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: false
          ldproxy: true

      - uses: taiki-e/install-action@v2
        with:
          tool: espflash

      - name: Restore cache (ESP-IDF, cargo)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.espressif
            rust/boards/jc3636k718c/firmware/.embuild
            rust/boards/jc3636k718c/firmware/target
          key: fw-${{ runner.os }}-${{ hashFiles('rust/boards/jc3636k718c/firmware/Cargo.lock', 'rust/boards/jc3636k718c/firmware/sdkconfig.defaults', 'sdkconfig.jc3636k718c', 'dependencies.lock') }}

      - name: Build firmware
        working-directory: rust/boards/jc3636k718c/firmware
        run: cargo build --release

      # Save even when a later step fails, so a retry does not download everything again.
      - name: Save cache
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.espressif
            rust/boards/jc3636k718c/firmware/.embuild
            rust/boards/jc3636k718c/firmware/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Merge into one image
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = tag ] || version="0.0.0-${GITHUB_SHA::7}"
          tools/webflash/merge.sh "$version"

      - name: Assemble the site
        run: |
          mkdir -p _site/flash/firmware
          cp site/index.html _site/index.html
          cp tools/webflash/index.html tools/webflash/manifest.json tools/webflash/update.json _site/flash/
          cp tools/webflash/firmware/*.bin _site/flash/firmware/
          cp -r site/fonts _site/fonts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/upload-artifact@v4
        with:
          name: orbiversum-image
          path: tools/webflash/firmware/*.bin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: orbiversum-image
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            orbiversum.bin
            orbiversum-app.bin
